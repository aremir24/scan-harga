<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Barcode & Harga</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, sans-serif; background:#f4f4f5; color:#18181b; padding-bottom:80px; }
  header { background:#18181b; color:#fff; padding:14px 16px; font-weight:600; font-size:18px; display:flex; justify-content:space-between; align-items:center;}
  header button { background:#16a34a; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:bold;}
  
  .wrap { padding:16px; }
  .btn { width:100%; padding:16px; font-size:17px; font-weight:600; border:none; border-radius:12px; background:#2563eb; color:#fff; cursor:pointer; margin-bottom:10px;}
  .btn.dark { background:#18181b; }
  .btn.green { background:#16a34a; }
  .btn.red { background:#dc2626; }
  .btn.grey { background:#52525b; }
  .btn:active { opacity:.8; }

  #reader { width: 100%; display: none; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px;}
  #reader video { display: block; width: 100% !important; height: auto !important; }
  #msg { font-size:14px; text-align:center; color:#2563eb; font-weight:bold; margin-bottom:10px; min-height: 20px;}

  #list { list-style:none; padding:0; margin:0; }
  #list li { background:#fff; padding:12px 16px; margin-bottom:8px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; border-left: 5px solid #2563eb; cursor:pointer; }
  #list li .info { display:flex; flex-direction:column; flex:1; }
  #list li .nm { font-size:16px; font-weight:bold; }
  #list li .bc { font-size:12px; color:#71717a; }
  #list li .pr { font-weight:bold; color:#2563eb; font-size:16px; margin-left:10px; }
  #list li .del { background:none; border:none; color:#dc2626; font-size:20px; cursor:pointer; padding:0 5px; }
  
  #list li.no-price { border-left-color: #eab308; }
  #list li.no-price .pr { color: #eab308; font-size: 14px; font-style: italic;}

  #total { position:fixed; bottom:0; left:0; right:0; background:#18181b; color:#fff; padding:16px; display:flex; justify-content:space-between; font-weight:bold; font-size:16px; z-index:10;}
  #total .count { color: #a1a1aa; font-size: 14px;}

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:99; }
  .overlay.show { display:block; }
  
  #form { display:none; background:#fff; padding:20px; border-radius:12px; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:90%; max-width:400px; z-index:100; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  #form h3 { margin:0 0 15px; font-size:18px; }
  #form label { font-size:13px; font-weight:600; color:#52525b; margin-bottom:4px; display:block; }
  #form input { width:100%; padding:12px; font-size:16px; border:1px solid #d4d4d8; border-radius:8px; margin-bottom:15px; }

  #backupModal { display:none; background:#fff; padding:20px; border-radius:12px; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:90%; max-width:400px; z-index:100; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align:center;}
  #backupModal h3 { margin:0 0 15px; font-size:18px; }
</style>
</head>
<body>

<header>
  <span>🛒 Scan Barang</span>
  <button id="backupBtn">💾 Backup/Import</button>
</header>

<div class="wrap">
  <div id="reader"></div>

  <p id="msg">Tekan butang di bawah untuk mula scan.</p>

  <button class="btn" id="startBtn">📷 Mula Scan Kamera</button>
  <button class="btn dark" id="manualBtn">⌨️ Masukkan Barcode Manual</button>

  <hr style="border:0; border-top:1px solid #d4d4d8; margin:20px 0;">
  <ul id="list"></ul>
  
  <button class="btn red" id="resetBtn" style="margin-top:10px; display:none;">Kosongkan Senarai (Sesi Baru)</button>
</div>

<div id="total">
  <span>Senarai Belanja <span class="count" id="count">(0 barang)</span></span>
</div>

<div class="overlay" id="overlay"></div>

<div id="form">
  <h3>Maklumat Barang</h3>
  <label>Barcode</label>
  <input type="text" id="inBarcode" readonly style="background:#f4f4f5; color:#71717a;">
  
  <label>Nama Barang</label>
  <input type="text" id="inNama" placeholder="cth: Susu 1L">
  
  <label>Harga (RM) - Boleh kosongkan dulu</label>
  <input type="number" id="inHarga" step="0.01" inputmode="decimal" placeholder="0.00">
  
  <button class="btn green" id="saveBtn">Simpan</button>
  <button class="btn grey" id="cancelBtn">Tutup</button>
</div>

<div id="backupModal">
  <h3>💾 Backup & Restore</h3>
  <p style="font-size:13px; color:#52525b; margin-bottom:15px;">Simpan fail ke telefon, atau pulihkan dari fail JSON.</p>
  
  <button class="btn green" id="exportBtn">⬇️ Simpan Fail (Export)</button>
  <label for="fileInput" class="btn dark" style="display:block; text-align:center; line-height:24px;">⬆️ Import Fail (Tambah Data)</label>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none;">
  
  <button class="btn grey" id="closeBackup" style="margin-top:10px;">Tutup</button>
</div>

<script>
const LS_DATA = 'senarai_barcode';
const LS_HARGA = 'db_harga';

let senarai = JSON.parse(localStorage.getItem(LS_DATA) || '[]');
let dbHarga = JSON.parse(localStorage.getItem(LS_HARGA) || '{}');
let html5QrCode = null;
let editIndex = -1;
let isProcessingScan = false;

const $ = id => document.getElementById(id);

function render() {
  const ul = $('list');
  ul.innerHTML = '';

  senarai.forEach((item, index) => {
    const li = document.createElement('li');
    if (!item.harga || item.harga <= 0) {
      li.classList.add('no-price');
    }
    
    li.onclick = (e) => {
        if(e.target.tagName !== 'BUTTON') bukaForm(index);
    };

    li.innerHTML = `
      <div class="info">
        <span class="nm">${item.nama || '(Belum letak nama)'}</span>
        <span class="bc">${item.barcode}</span>
      </div>
      <span class="pr">${item.harga > 0 ? 'RM ' + item.harga.toFixed(2) : 'Set Harga'}</span>
      <button class="del" onclick="hapus(${index})">✕</button>
    `;
    ul.appendChild(li);
  });

  $('count').textContent = '(' + senarai.length + ' barang)';
  $('resetBtn').style.display = senarai.length > 0 ? 'block' : 'none';
  localStorage.setItem(LS_DATA, JSON.stringify(senarai));
}

window.hapus = function(index) {
  senarai.splice(index, 1);
  render();
}

window.bukaForm = function(index) {
  editIndex = index;
  const item = senarai[index];
  
  $('inBarcode').value = item.barcode;
  $('inNama').value = item.nama || '';
  $('inHarga').value = item.harga > 0 ? item.harga : '';
  
  $('overlay').classList.add('show');
  $('form').style.display = 'block';
  
  if (item.nama) $('inHarga').focus();
  else $('inNama').focus();
}

$('saveBtn').onclick = () => {
  const nama = $('inNama').value.trim();
  const harga = parseFloat($('inHarga').value) || 0;
  const barcode = $('inBarcode').value;

  senarai[editIndex].nama = nama;
  senarai[editIndex].harga = harga;

  if (barcode !== 'manual' && nama !== '') {
    dbHarga[barcode] = { nama, harga };
    localStorage.setItem(LS_HARGA, JSON.stringify(dbHarga));
  }

  render();
  tutupForm();
};

function tutupForm() {
  $('overlay').classList.remove('show');
  $('form').style.display = 'none';
  editIndex = -1;
  isProcessingScan = false; 
}
$('cancelBtn').onclick = tutupForm;
$('overlay').onclick = tutupForm;

function onScanSuccess(decodedText) {
  if (isProcessingScan) return;

  if (navigator.vibrate) navigator.vibrate(100);

  const dahAda = senarai.find(x => x.barcode === decodedText);
  if (dahAda) {
    $('msg').textContent = '⚠️ Barang dah ada dalam senarai!';
    $('msg').style.color = '#dc2626';
    return;
  }

  const memori = dbHarga[decodedText];
  
  senarai.push({ 
    barcode: decodedText, 
    nama: memori ? memori.nama : '', 
    harga: memori ? memori.harga : 0 
  });
  
  render();
  
  $('msg').textContent = '✅ ' + (memori && memori.nama ? memori.nama : decodedText) + ' ditambah!';
  $('msg').style.color = '#16a34a';

  if (!memori || !memori.nama) {
    isProcessingScan = true; 
    bukaForm(senarai.length - 1);
  }
}

$('startBtn').onclick = async () => {
  $('startBtn').style.display = 'none';
  $('reader').style.display = 'block';
  $('msg').textContent = 'Membuka kamera...';

  html5QrCode = new Html5Qrcode("reader");
  
  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      onScanSuccess
    );
    $('msg').textContent = 'Halakan kamera ke barcode...';
  } catch (err) {
    $('msg').textContent = 'Kamera gagal: ' + err;
    $('msg').style.color = '#dc2626';
    $('reader').style.display = 'none';
    $('startBtn').style.display = 'block';
  }
};

$('manualBtn').onclick = () => {
  const input = prompt("Masukkan nombor barcode:");
  if (input && input.trim() !== '') {
    onScanSuccess(input.trim());
  }
};

$('resetBtn').onclick = () => {
  if(confirm("Kosongkan senarai untuk shopping baru? (Memori harga barang kekal)")) {
    senarai = [];
    render();
  }
};

// ===== FUNGSI BACKUP & IMPORT (MERGE) =====
$('backupBtn').onclick = () => {
  $('overlay').classList.add('show');
  $('backupModal').style.display = 'block';
};

$('closeBackup').onclick = () => {
  $('overlay').classList.remove('show');
  $('backupModal').style.display = 'none';
};

// Export (Simpan)
$('exportBtn').onclick = () => {
  const dataSimpan = { 
    tarikh: new Date().toISOString(), 
    senarai: senarai, 
    memoriHarga: dbHarga 
  };
  const dataTeks = JSON.stringify(dataSimpan, null, 2);
  const blob = new Blob([dataTeks], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  
  a.href = url;
  a.download = `backup-scan-harga-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  
  URL.revokeObjectURL(url);
  $('closeBackup').click();
  alert("✅ Fail backup berjaya dimuat turun ke folder Download!");
};

// Import (Pulihkan & CAMPUR)
$('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const data = JSON.parse(event.target.result);
      
      if (!data.memoriHarga) {
        throw new Error("Fail ini tiada data memori harga.");
      }

      // CAMPURKAN (MERGE) data memori harga
      // Fail JSON akan overwrite (ambil alih) harga lama jika ada barcode yang sama
      for (let barcode in data.memoriHarga) {
        dbHarga[barcode] = data.memoriHarga[barcode];
      }
      
      localStorage.setItem(LS_HARGA, JSON.stringify(dbHarga));

      // CAMPURKAN senarai (jika fail tu ada senarai)
      if (data.senarai && Array.isArray(data.senarai)) {
        data.senarai.forEach(itemBaru => {
          // Kalau barang dah ada dalam senarai skrin, jangan tambah dua kali
          if (!senarai.find(x => x.barcode === itemBaru.barcode)) {
             senarai.push(itemBaru);
          }
        });
        localStorage.setItem(LS_DATA, JSON.stringify(senarai));
      }
      
      render();
      $('closeBackup').click();
      alert("✅ Data berjaya dicampur (Merge)! Harga lama dikekalkan, harga baru ditambah.");
      
    } catch (err) {
      alert("❌ Gagal import: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; 
};

render();
</script>
</body>
</html>
