<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Barcode</title>
<!-- Pustaka scanner paling stabil untuk mobile -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#f4f4f5; color:#18181b; padding-bottom:80px; }
  header { background:#18181b; color:#fff; padding:14px 16px; font-weight:600; font-size:18px; }
  .wrap { padding:16px; }
  
  .btn { width:100%; padding:16px; font-size:17px; font-weight:600; border:none; border-radius:12px; background:#2563eb; color:#fff; cursor:pointer; margin-bottom:10px;}
  .btn.dark { background:#18181b; }
  .btn:active { opacity:.8; }

  /* Bekas Kamera */
  #reader { width: 100%; display: none; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px;}
  #reader video { display: block; width: 100% !important; height: auto !important; }

  #msg { font-size:14px; text-align:center; color:#2563eb; font-weight:bold; margin-bottom:10px; min-height: 20px;}

  /* Senarai Barang */
  #list { list-style:none; padding:0; margin:0; }
  #list li { background:#fff; padding:12px 16px; margin-bottom:8px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; border-left: 5px solid #2563eb; }
  #list li .info { display:flex; flex-direction:column; }
  #list li .bc { font-weight:bold; font-size:16px; }
  #list li .nm { font-size:13px; color:#71717a; }
  #list li .del { background:none; border:none; color:#dc2626; font-size:20px; cursor:pointer; }

  /* Bahagian Bawah (Total) */
  #total { position:fixed; bottom:0; left:0; right:0; background:#18181b; color:#fff; padding:16px; display:flex; justify-content:space-between; font-weight:bold; font-size:16px;}
</style>
</head>
<body>

<header>🛒 Scan Barcode</header>

<div class="wrap">
  <!-- Kamera akan buka di sini -->
  <div id="reader"></div>

  <p id="msg">Tekan butang di bawah untuk mula scan.</p>

  <button class="btn" id="startBtn">📷 Mula Scan Kamera</button>
  <button class="btn dark" id="manualBtn">⌨️ Masukkan Barcode Manual</button>

  <hr style="border:0; border-top:1px solid #d4d4d8; margin:20px 0;">

  <ul id="list"></ul>
</div>

<div id="total">
  <span>Jumlah Barang</span>
  <span id="count">0</span>
</div>

<script>
const LS_DATA = 'senarai_barcode';
let senarai = JSON.parse(localStorage.getItem(LS_DATA) || '[]');
let html5QrCode = null;

const $ = id => document.getElementById(id);

// Fungsi kemaskini paparan
function render() {
  const ul = $('list');
  ul.innerHTML = '';
  
  senarai.forEach((item, index) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="info">
        <span class="bc">${item.barcode}</span>
        <span class="nm">${item.nama || 'Belum ada nama'}</span>
      </div>
      <button class="del" onclick="hapus(${index})">✕</button>
    `;
    ul.appendChild(li);
  });

  $('count').textContent = senarai.length + ' barang';
  localStorage.setItem(LS_DATA, JSON.stringify(senarai));
}

window.hapus = function(index) {
  senarai.splice(index, 1);
  render();
}

// Fungsi bila scan berjaya
function onScanSuccess(decodedText, decodedResult) {
  // 1. Bunyi getar
  if (navigator.vibrate) navigator.vibrate(100);

  // 2. Semak jika dah ada dalam senarai
  const dahAda = senarai.find(x => x.barcode === decodedText);
  if (dahAda) {
    $('msg').textContent = '⚠️ Barcode ' + decodedText + ' dah ada!';
    $('msg').style.color = '#dc2626';
    return;
  }

  // 3. Tambah ke senarai (Kosongkan nama & harga dulu)
  senarai.push({ barcode: decodedText, nama: '', harga: 0 });
  render();
  
  $('msg').textContent = '✅ ' + decodedText + ' berjaya ditambah!';
  $('msg').style.color = '#16a34a';
}

// Mula Kamera
$('startBtn').onclick = async () => {
  $('startBtn').style.display = 'none';
  $('reader').style.display = 'block';
  $('msg').textContent = 'Membuka kamera...';

  html5QrCode = new Html5Qrcode("reader");
  
  try {
    // Mula scanner (auto detect kamera belakang)
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      onScanSuccess
    );
    $('msg').textContent = 'Halakan kamera ke barcode...';
  } catch (err) {
    $('msg').textContent = 'Kamera gagal: ' + err;
    $('msg').style.color = '#dc2626';
    $('reader').style.display = 'none';
    $('startBtn').style.display = 'block';
  }
};

// Manual Input (Guna prompt ringkas)
$('manualBtn').onclick = () => {
  const input = prompt("Masukkan nombor barcode:");
  if (input && input.trim() !== '') {
    onScanSuccess(input.trim());
  }
};

// Jalankan render masa mula buka
render();
</script>
</body>
</html>
